name: Update MHLW News
on:
  schedule:
    - cron: '45 22 * * *' # 毎日午前7時45分（日本時間）に自動実行
  workflow_dispatch: # 手動実行用
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch and Parse RSS
        run: |
          python -c '
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import datetime

          url = "https://www.mhlw.go.jp/stf/news.rdf"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          try:
              with urllib.request.urlopen(req) as response:
                  xml_data = response.read()
              
              root = ET.fromstring(xml_data)
              
              # RSS/RDFのネームスペース対応
              namespaces = {
                  "rdf": "http://www.w3.org/1999/02/22-rdf-syntax-ns#",
                  "rss": "http://purl.org/rss/1.0/",
                  "dc": "http://purl.org/dc/elements/1.1/"
              }
              
              items = []
              # item要素を取得
              for item in root.findall(".//rss:item", namespaces):
                  title_el = item.find("rss:title", namespaces)
                  link_el = item.find("rss:link", namespaces)
                  date_el = item.find("dc:date", namespaces)
                  
                  title = title_el.text.strip() if title_el is not None and title_el.text else "タイトルなし"
                  link = link_el.text.strip() if link_el is not None and link_el.text else "#"
                  pubDate = date_el.text.strip() if date_el is not None and date_el.text else ""
                  
                  items.append({
                      "title": title,
                      "link": link,
                      "pubDate": pubDate
                  })
              
              output = {"items": items}
              with open("news.json", "w", encoding="utf-8") as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)
              print(f"Successfully saved {len(items)} items.")
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          '
      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news data via Python" && git push)
