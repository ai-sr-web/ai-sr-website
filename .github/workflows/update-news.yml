name: Update MHLW News
on:
  schedule:
    - cron: '0 23 * * *' # 毎日午前8時（日本時間）に自動実行
  workflow_dispatch: # 手動で実行するための設定
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS and save as JSON
        run: curl -s "https://api.rss2json.com/v1/api.json?rss_url=https://www.mhlw.go.jp/stf/news.rdf&count=30" > news.json
      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news data" && git push)
